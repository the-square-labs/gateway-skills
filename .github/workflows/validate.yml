name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate manifests, skills, and links
        run: python3 scripts/validate-repository.py

      - name: Compile Python helpers
        run: python3 -m py_compile scripts/*.py skills/*/scripts/*.py

      - name: Discover the published skill layout
        run: npx -y skills add . --list -a codex -y

      - name: Install every skill in isolation
        shell: bash
        run: |
          install_root="$(mktemp -d)"
          cd "$install_root"
          npx -y skills add "$GITHUB_WORKSPACE" --skill '*' -a codex -y
          for skill_dir in "$GITHUB_WORKSPACE"/skills/*/; do
            name="$(basename "$skill_dir")"
            test -f ".agents/skills/$name/SKILL.md" || test -f ".codex/skills/$name/SKILL.md" || {
              echo "missing installed skill: $name"
              exit 1
            }
          done

      - name: Install one skill in isolation
        shell: bash
        run: |
          install_root="$(mktemp -d)"
          cd "$install_root"
          npx -y skills add "$GITHUB_WORKSPACE" --skill publishing-html-pages -a codex -y
          test -f .agents/skills/publishing-html-pages/SKILL.md || test -f .codex/skills/publishing-html-pages/SKILL.md
          test ! -e .agents/skills/using-gateway && test ! -e .codex/skills/using-gateway
